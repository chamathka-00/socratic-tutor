<svg viewBox="0 0 940 560" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,4 L0,8 z" fill="#475569"/>
    </marker>
    <marker id="arrowR" markerWidth="9" markerHeight="9" refX="1" refY="4" orient="auto" markerUnits="strokeWidth">
      <path d="M8,0 L0,4 L8,8 z" fill="#475569"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="940" height="560" fill="#ffffff"/>

  <text x="40" y="50" font-size="24" font-weight="700" fill="#1e1b4b">Socratic — Architecture</text>
  <text x="40" y="76" font-size="14" fill="#64748b">A misconception-diagnosing algebra tutor grounded by Microsoft Foundry IQ</text>

  <!-- Student -->
  <rect x="40" y="235" width="175" height="95" rx="12" fill="#EEF2FF" stroke="#6366F1" stroke-width="2"/>
  <text x="127" y="278" font-size="17" font-weight="700" fill="#3730a3" text-anchor="middle">Student</text>
  <text x="127" y="302" font-size="12.5" fill="#475569" text-anchor="middle">submits incorrect</text>
  <text x="127" y="318" font-size="12.5" fill="#475569" text-anchor="middle">work / steps</text>

  <!-- Agent -->
  <rect x="305" y="120" width="330" height="320" rx="14" fill="#F5F3FF" stroke="#7C3AED" stroke-width="2.5"/>
  <text x="470" y="152" font-size="18" font-weight="700" fill="#5b21b6" text-anchor="middle">Socratic Agent</text>
  <text x="470" y="173" font-size="12.5" fill="#6d28d9" text-anchor="middle">Microsoft Foundry  ·  gpt-4.1-mini</text>

  <line x1="330" y1="188" x2="610" y2="188" stroke="#ddd6fe" stroke-width="1.5"/>

  <text x="330" y="216" font-size="13.5" fill="#312e81">1.  Parse the student's steps</text>
  <text x="330" y="244" font-size="13.5" fill="#312e81">2.  Diagnose the misconception</text>
  <text x="330" y="272" font-size="13.5" fill="#312e81">3.  Ask a Socratic probe question</text>
  <text x="330" y="300" font-size="13.5" fill="#312e81">4.  Scaffold toward understanding</text>

  <rect x="330" y="322" width="280" height="48" rx="8" fill="#FEF2F2" stroke="#FCA5A5" stroke-width="1.5"/>
  <text x="470" y="342" font-size="12" font-weight="600" fill="#b91c1c" text-anchor="middle">Guardrails</text>
  <text x="470" y="360" font-size="11.5" fill="#b91c1c" text-anchor="middle">never reveals the answer · admits uncertainty</text>

  <rect x="330" y="382" width="280" height="40" rx="8" fill="#F0FDF4" stroke="#86EFAC" stroke-width="1.5"/>
  <text x="470" y="406" font-size="12" fill="#166534" text-anchor="middle">Accessibility mode: plain language + text-to-speech</text>

  <!-- Foundry IQ -->
  <rect x="715" y="150" width="190" height="78" rx="12" fill="#ECFEFF" stroke="#06B6D4" stroke-width="2"/>
  <text x="810" y="183" font-size="15" font-weight="700" fill="#0e7490" text-anchor="middle">Foundry IQ</text>
  <text x="810" y="204" font-size="11.5" fill="#155e75" text-anchor="middle">knowledge base</text>
  <text x="810" y="219" font-size="11.5" fill="#155e75" text-anchor="middle">(Extractive retrieval)</text>

  <!-- Azure AI Search -->
  <rect x="715" y="268" width="190" height="78" rx="12" fill="#ECFEFF" stroke="#06B6D4" stroke-width="2"/>
  <text x="810" y="301" font-size="15" font-weight="700" fill="#0e7490" text-anchor="middle">Azure AI Search</text>
  <text x="810" y="322" font-size="11.5" fill="#155e75" text-anchor="middle">vector + semantic</text>
  <text x="810" y="337" font-size="11.5" fill="#155e75" text-anchor="middle">index (Basic tier)</text>

  <!-- Knowledge source -->
  <rect x="715" y="386" width="190" height="86" rx="12" fill="#F0FDF4" stroke="#22C55E" stroke-width="2"/>
  <text x="810" y="418" font-size="14" font-weight="700" fill="#15803d" text-anchor="middle">knowledge-base.md</text>
  <text x="810" y="439" font-size="11.5" fill="#166534" text-anchor="middle">8 algebra misconceptions</text>
  <text x="810" y="455" font-size="11.5" fill="#166534" text-anchor="middle">(probe + scaffold each)</text>

  <!-- Arrows: Student <-> Agent -->
  <line x1="216" y1="262" x2="302" y2="262" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="259" y="252" font-size="11" fill="#334155" text-anchor="middle">submits work</text>

  <line x1="302" y1="305" x2="216" y2="305" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="259" y="324" font-size="11" fill="#334155" text-anchor="middle">Socratic question</text>
  <text x="259" y="338" font-size="11" fill="#334155" text-anchor="middle">(no answer given)</text>

  <!-- Arrow: Agent <-> Foundry IQ -->
  <line x1="636" y1="189" x2="713" y2="189" stroke="#475569" stroke-width="2" marker-start="url(#arrowR)" marker-end="url(#arrow)"/>
  <text x="675" y="178" font-size="10.5" fill="#334155" text-anchor="middle">query +</text>
  <text x="675" y="208" font-size="10.5" fill="#334155" text-anchor="middle">cited results</text>

  <!-- Arrow: Foundry IQ -> Search -->
  <line x1="810" y1="230" x2="810" y2="266" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Arrow: Search -> Knowledge source -->
  <line x1="810" y1="348" x2="810" y2="384" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>

  <text x="40" y="520" font-size="11.5" fill="#94a3b8">Required Microsoft IQ layer: Foundry IQ  ·  Built on Azure AI Search  ·  Embeddings: text-embedding-3-small</text>
</svg>
