<svg viewBox="0 0 960 560" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,4 L0,8 z" fill="#475569"/>
    </marker>
    <marker id="arrowR" markerWidth="9" markerHeight="9" refX="1" refY="4" orient="auto" markerUnits="strokeWidth">
      <path d="M8,0 L0,4 L8,8 z" fill="#475569"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="960" height="560" fill="#ffffff"/>

  <text x="40" y="48" font-size="24" font-weight="700" fill="#1e1b4b">Socratic Architecture</text>
  <text x="40" y="74" font-size="14" fill="#64748b">A misconception-diagnosing algebra tutor grounded by Microsoft Foundry IQ</text>

  <!-- Student -->
  <rect x="40" y="150" width="170" height="72" rx="12" fill="#EEF2FF" stroke="#6366F1" stroke-width="2"/>
  <text x="125" y="184" font-size="17" font-weight="700" fill="#3730a3" text-anchor="middle">Student</text>
  <text x="125" y="205" font-size="12" fill="#475569" text-anchor="middle">uses the web app</text>

  <!-- Chainlit UI -->
  <rect x="40" y="300" width="170" height="88" rx="12" fill="#FEF9C3" stroke="#CA8A04" stroke-width="2"/>
  <text x="125" y="333" font-size="15" font-weight="700" fill="#854d0e" text-anchor="middle">Chainlit Web UI</text>
  <text x="125" y="354" font-size="11.5" fill="#713f12" text-anchor="middle">chat interface</text>
  <text x="125" y="370" font-size="11.5" fill="#713f12" text-anchor="middle">(app.py)</text>

  <!-- Agent -->
  <rect x="300" y="150" width="330" height="300" rx="14" fill="#F5F3FF" stroke="#7C3AED" stroke-width="2.5"/>
  <text x="465" y="182" font-size="18" font-weight="700" fill="#5b21b6" text-anchor="middle">Socratic Agent</text>
  <text x="465" y="203" font-size="12.5" fill="#6d28d9" text-anchor="middle">Microsoft Foundry  ·  gpt-4.1-mini</text>
  <line x1="324" y1="216" x2="606" y2="216" stroke="#ddd6fe" stroke-width="1.5"/>
  <text x="324" y="246" font-size="13.5" fill="#312e81">1.  Parse the student's steps</text>
  <text x="324" y="274" font-size="13.5" fill="#312e81">2.  Diagnose the misconception</text>
  <text x="324" y="302" font-size="13.5" fill="#312e81">3.  Ask a Socratic probe question</text>
  <text x="324" y="330" font-size="13.5" fill="#312e81">4.  Scaffold toward understanding</text>
  <rect x="320" y="348" width="290" height="46" rx="8" fill="#FEF2F2" stroke="#FCA5A5" stroke-width="1.5"/>
  <text x="465" y="368" font-size="12" font-weight="600" fill="#b91c1c" text-anchor="middle">Guardrails</text>
  <text x="465" y="385" font-size="11.5" fill="#b91c1c" text-anchor="middle">never reveals the answer · admits uncertainty</text>
  <rect x="320" y="402" width="290" height="38" rx="8" fill="#F0FDF4" stroke="#86EFAC" stroke-width="1.5"/>
  <text x="465" y="426" font-size="11.5" fill="#166534" text-anchor="middle">Accessibility mode: plain language + text-to-speech</text>

  <!-- Foundry IQ -->
  <rect x="715" y="150" width="200" height="78" rx="12" fill="#ECFEFF" stroke="#06B6D4" stroke-width="2"/>
  <text x="815" y="183" font-size="15" font-weight="700" fill="#0e7490" text-anchor="middle">Foundry IQ</text>
  <text x="815" y="204" font-size="11.5" fill="#155e75" text-anchor="middle">knowledge base</text>
  <text x="815" y="219" font-size="11.5" fill="#155e75" text-anchor="middle">(Extractive retrieval)</text>

  <!-- Azure AI Search -->
  <rect x="715" y="268" width="200" height="78" rx="12" fill="#ECFEFF" stroke="#06B6D4" stroke-width="2"/>
  <text x="815" y="301" font-size="15" font-weight="700" fill="#0e7490" text-anchor="middle">Azure AI Search</text>
  <text x="815" y="322" font-size="11.5" fill="#155e75" text-anchor="middle">vector + semantic</text>
  <text x="815" y="337" font-size="11.5" fill="#155e75" text-anchor="middle">index (Basic tier)</text>

  <!-- Knowledge source -->
  <rect x="715" y="386" width="200" height="86" rx="12" fill="#F0FDF4" stroke="#22C55E" stroke-width="2"/>
  <text x="815" y="418" font-size="14" font-weight="700" fill="#15803d" text-anchor="middle">knowledge-base.md</text>
  <text x="815" y="439" font-size="11.5" fill="#166534" text-anchor="middle">8 algebra misconceptions</text>
  <text x="815" y="455" font-size="11.5" fill="#166534" text-anchor="middle">(probe + scaffold each)</text>

  <!-- Arrow: Student <-> Chainlit UI -->
  <line x1="125" y1="224" x2="125" y2="298" stroke="#475569" stroke-width="2" marker-start="url(#arrowR)" marker-end="url(#arrow)"/>

  <!-- Arrow: Chainlit UI <-> Agent -->
  <line x1="212" y1="344" x2="298" y2="344" stroke="#475569" stroke-width="2" marker-start="url(#arrowR)" marker-end="url(#arrow)"/>
  <text x="255" y="334" font-size="10.5" fill="#334155" text-anchor="middle">message / reply</text>

  <!-- Arrow: Agent <-> Foundry IQ -->
  <line x1="632" y1="189" x2="713" y2="189" stroke="#475569" stroke-width="2" marker-start="url(#arrowR)" marker-end="url(#arrow)"/>
  <text x="672" y="178" font-size="10.5" fill="#334155" text-anchor="middle">query +</text>
  <text x="672" y="208" font-size="10.5" fill="#334155" text-anchor="middle">cited results</text>

  <!-- Arrow: Foundry IQ -> Search -->
  <line x1="815" y1="230" x2="815" y2="266" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <!-- Arrow: Search -> Knowledge source -->
  <line x1="815" y1="348" x2="815" y2="384" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>

  <text x="40" y="528" font-size="11.5" fill="#94a3b8">Required Microsoft IQ layer: Foundry IQ  ·  Built on Azure AI Search  ·  Embeddings: text-embedding-3-small</text>
</svg>
